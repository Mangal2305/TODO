<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Todo App</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="authSection" class="auth-container">
    <div class="auth-card">
      <h1>✅ Todo App</h1>
      <div class="tabs">
        <button id="loginTab" class="tab-btn active">Login</button>
        <button id="registerTab" class="tab-btn">Register</button>
      </div>
      <form id="loginForm" class="auth-form">
        <input type="email" id="loginEmail" placeholder="Email" required autocomplete="username" />
        <input type="password" id="loginPassword" placeholder="Password" required autocomplete="current-password" />
        <button type="submit">Login</button>
      </form>
      <form id="registerForm" class="auth-form hidden">
        <input type="email" id="registerEmail" placeholder="Email" required autocomplete="username" />
        <input type="password" id="registerPassword" placeholder="Password (min 6 chars)" required autocomplete="new-password" />
        <button type="submit">Register</button>
      </form>
      <p id="errorMsg" class="error hidden"></p>
    </div>
  </div>

  <div id="dashboardSection" class="dashboard-container hidden">
    <header>
      <h1>✅ My Todos</h1>
      <div>
        <span id="userEmail"></span>
        <button id="logoutBtn">Logout</button>
      </div>
    </header>
    <form id="addTodoForm" class="add-todo-form">
      <input type="text" id="todoInput" placeholder="What needs to be done?" required />
      <button type="submit">Add</button>
    </form>
    <ul id="todoList" class="todo-list"></ul>
    <p id="emptyMsg" class="empty-msg hidden">No todos yet. Add one above!</p>
  </div>

  <script src="config.js?v=1.0.2"></script>
  <script src="app.js?v=1.0.2"></script>
</body>
</html>
