version: '3.8'

# Used on the EC2 instance. Images are pulled from GHCR (built by CI/CD).
# Backend connects to an external RDS Postgres instance instead of a local
# postgres container. Provide these values via a .env file on the EC2 host
# (see DEPLOYMENT.md) - never commit real secrets.

services:
  backend:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER}/todo-backend:latest
    container_name: todo-backend
    restart: unless-stopped
    environment:
      PORT: 5000
      DB_HOST: ${RDS_HOST}
      DB_PORT: 5432
      DB_USER: ${RDS_USER}
      DB_PASSWORD: ${RDS_PASSWORD}
      DB_NAME: ${RDS_DB_NAME}
      DB_SSL: "true"
      JWT_SECRET: ${JWT_SECRET}
    ports:
      - "5000:5000"

  frontend:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER}/todo-frontend:latest
    container_name: todo-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
