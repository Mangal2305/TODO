version: '3.8'

services:
  backend:
    image: ghcr.io/mangal2305/todo-backend:latest
    container_name: todo-backend
    restart: unless-stopped
    environment:
      PORT: 5000
      DB_HOST: ${RDS_HOST}
      DB_PORT: 5432
      DB_USER: ${RDS_USER}
      DB_PASSWORD: ${RDS_PASSWORD}
      DB_NAME: ${RDS_DB_NAME}
      DB_SSL: "true"
      JWT_SECRET: ${JWT_SECRET}
    ports:
      - "5000:5000"

  frontend:
    image: ghcr.io/mangal2305/todo-frontend:latest
    container_name: todo-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"